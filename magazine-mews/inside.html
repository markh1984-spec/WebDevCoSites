<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Inside Magazine Mews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* Same theme as the main page (content.js theme block). */
  :root {
    --green-900: #4A1F3D; --green-950: #2E1428; --green-800: #4A1F3D; --green-700: #6B2350;
    --brass: #A83D6C; --brass-light: #F1DCE6; --brick: #8E2F5A; --brick-dark: #5E1F48;
    --paper: #FBF4F6; --cream: #F3DEE7; --ink: #2E1428; --muted: #5A3A50;
    --green-100: #F3DEE7; --mortar: #EBD5DE; --line: #EBD5DE;
    --font-display: "Fraunces", Georgia, serif; --font-body: "DM Sans", system-ui, sans-serif;
  }
  body { background: var(--paper); color: var(--ink); }
  .in-top { border-bottom: 1px solid var(--line); background: #fff; }
  .in-top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 68px; }
  .in-brand { font: 600 1.25rem/1.1 var(--font-display); color: var(--green-900); text-decoration: none; }
  .in-brand small { display: block; font: 600 .66rem/1.4 var(--font-body); letter-spacing: .18em; text-transform: uppercase; color: var(--brick); }
  .in-head { padding: 2.6rem 0 1.4rem; }
  .in-head h1 { font-family: var(--font-display); color: var(--green-900); font-size: clamp(2rem, 5vw, 3rem); margin: .3rem 0 .6rem; }
  .in-head p { margin: 0; color: var(--muted); max-width: 40rem; }
  .in-grid { list-style: none; margin: 0 0 3rem; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .in-grid button { all: unset; cursor: zoom-in; display: block; width: 100%; }
  .in-grid button:focus-visible img { outline: 3px solid var(--brass); outline-offset: 3px; }
  .in-grid img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 18px; background: var(--cream); }
  .in-grid figcaption { margin-top: .5rem; font-size: .92rem; color: var(--muted); }
  .in-grid figure { margin: 0; }
  .in-cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 0 0 4rem; }
  .in-msg { padding: 4rem 0; max-width: 36rem; }
  .in-msg h1 { font-family: var(--font-display); color: var(--green-900); }
  .in-box { position: fixed; inset: 0; z-index: 50; background: rgba(46, 20, 40, .94); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
  .in-box[hidden] { display: none; }
  .in-box img { max-width: 100%; max-height: calc(100vh - 130px); object-fit: contain; border-radius: 6px; }
  .in-box p { color: #F1DCE6; margin: .8rem 0 0; font-size: .95rem; }
  .in-box .in-nav { position: absolute; top: 50%; transform: translateY(-50%); }
  .in-box .in-prev { left: 12px; } .in-box .in-next { right: 12px; }
  .in-box .in-close { position: absolute; top: 12px; right: 12px; }
  .in-box button { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 999px; width: 46px; height: 46px; font-size: 22px; cursor: pointer; }
  @media (max-width: 820px) { .in-grid { grid-template-columns: 1fr 1fr; gap: 10px; } }
  @media (max-width: 480px) { .in-grid { grid-template-columns: 1fr; } }
</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body class="no-brick look-soft">
<header class="in-top">
  <div class="wrap">
    <a class="in-brand" href="/">Magazine Mews<small>Shoeburyness</small></a>
    <a class="btn btn-brass" href="/#enquire">Arrange a viewing</a>
  </div>
</header>

<main class="wrap" id="main">
  <div class="in-msg" id="in-loading"><p>Opening the photos…</p></div>

  <div id="in-error" class="in-msg" hidden>
    <h1>This link isn't working</h1>
    <p id="in-error-text">It may have expired. You can ask for a new one on the website.</p>
    <p><a class="btn btn-green" href="/#photos">Get a new link</a></p>
  </div>

  <div id="in-content" hidden>
    <div class="in-head">
      <p class="eyebrow">Inside</p>
      <h1>Inside Magazine Mews</h1>
      <p id="in-hello"></p>
    </div>
    <ul class="in-grid" id="in-grid"></ul>
    <div class="in-cta">
      <a class="btn btn-green" href="/#enquire">Arrange a viewing</a>
      <span class="in-or">or reply to the email we sent you.</span>
    </div>
  </div>
</main>

<div class="in-box" id="in-box" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="in-close" type="button" id="in-close" aria-label="Close">×</button>
  <button class="in-nav in-prev" type="button" id="in-prev" aria-label="Previous photo">‹</button>
  <img id="in-box-img" alt="">
  <p id="in-box-cap"></p>
  <button class="in-nav in-next" type="button" id="in-next" aria-label="Next photo">›</button>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var t = new URLSearchParams(location.search).get("t") || "";
  var photos = [], current = 0;

  function fail(msg) {
    $("in-loading").hidden = true;
    if (msg) $("in-error-text").textContent = msg;
    $("in-error").hidden = false;
  }
  if (!t) return fail("This page needs the link from your email.");

  // Tell the family only the first time this link is opened in this browser.
  var key = "mm-seen-" + t.slice(-16), first = "1";
  try { if (localStorage.getItem(key)) first = "0"; } catch (e) {}

  fetch("/api/inside?t=" + encodeURIComponent(t) + "&first=" + first, { cache: "no-store" })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error || ""); return j; }); })
    .then(function (j) {
      try { localStorage.setItem(key, "1"); } catch (e) {}
      photos = j.photos || [];
      $("in-hello").textContent = "Hi " + j.name + ", here are all the photos of the house. Tap any of them to see it bigger.";
      photos.forEach(function (p, i) {
        var li = document.createElement("li");
        var fig = document.createElement("figure");
        var b = document.createElement("button");
        b.type = "button";
        b.setAttribute("aria-label", "Open photo: " + p.caption);
        var img = document.createElement("img");
        img.src = p.src; img.alt = p.alt || p.caption; img.loading = i < 6 ? "eager" : "lazy";
        b.appendChild(img);
        b.addEventListener("click", function () { open(i); });
        var cap = document.createElement("figcaption");
        cap.textContent = p.caption;
        fig.appendChild(b); fig.appendChild(cap); li.appendChild(fig);
        $("in-grid").appendChild(li);
      });
      $("in-loading").hidden = true;
      $("in-content").hidden = false;
    })
    .catch(function (e) { fail(e && e.message ? e.message : ""); });

  function show(i) {
    current = (i + photos.length) % photos.length;
    $("in-box-img").src = photos[current].src;
    $("in-box-img").alt = photos[current].alt || "";
    $("in-box-cap").textContent = photos[current].caption + " · " + (current + 1) + " of " + photos.length;
  }
  function open(i) { show(i); $("in-box").hidden = false; $("in-close").focus(); }
  function close() { $("in-box").hidden = true; }
  $("in-close").addEventListener("click", close);
  $("in-prev").addEventListener("click", function () { show(current - 1); });
  $("in-next").addEventListener("click", function () { show(current + 1); });
  $("in-box").addEventListener("click", function (e) { if (e.target === this) close(); });
  document.addEventListener("keydown", function (e) {
    if ($("in-box").hidden) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(current - 1);
    if (e.key === "ArrowRight") show(current + 1);
  });
})();
</script>
</body>
</html>
