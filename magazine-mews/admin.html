<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Contacts · Magazine Mews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* Mom's contacts page, 2 Nov 2026. Same theme as the main page.
     Names start "cx-", not "ad-": ad blockers hide anything called "ad-…". */
  :root {
    --green-900: #4A1F3D; --green-950: #2E1428; --green-800: #4A1F3D; --green-700: #6B2350;
    --brass: #A83D6C; --brass-light: #F1DCE6; --brick: #8E2F5A; --brick-dark: #5E1F48;
    --paper: #FBF4F6; --cream: #F3DEE7; --ink: #2E1428; --muted: #5A3A50;
    --green-100: #F3DEE7; --mortar: #EBD5DE; --line: #EBD5DE;
    --font-display: "Fraunces", Georgia, serif; --font-body: "DM Sans", system-ui, sans-serif;
  }
  body { background: var(--paper); color: var(--ink); }
  .cx-top { border-bottom: 1px solid var(--line); background: #fff; }
  .cx-top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; }
  .cx-brand { font: 600 1.2rem/1.1 var(--font-display); color: var(--green-900); text-decoration: none; }
  .cx-brand small { display: block; font: 600 .66rem/1.4 var(--font-body); letter-spacing: .18em; text-transform: uppercase; color: var(--brick); }
  .cx-head { padding: 2rem 0 1rem; }
  .cx-head h1 { font-family: var(--font-display); color: var(--green-900); font-size: clamp(1.9rem, 5vw, 2.6rem); margin: 0 0 .4rem; }
  .cx-sum { margin: 0; color: var(--muted); }
  .cx-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 1rem 0 1.4rem; }
  .cx-tools input, .cx-tools select { font: inherit; padding: .65rem .9rem; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); }
  .cx-tools input { flex: 1 1 220px; min-width: 0; }
  .cx-btn { font: 600 .95rem var(--font-body); padding: .65rem 1.1rem; border-radius: 999px; border: 1px solid var(--brass); background: #fff; color: var(--brick); cursor: pointer; }
  .cx-btn.primary { background: var(--brass); color: #fff; }
  .cx-btn:disabled { opacity: .6; cursor: default; }
  .cx-list { list-style: none; margin: 0 0 3rem; padding: 0; display: grid; gap: 14px; }
  .cx-card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 1.1rem 1.2rem; }
  .cx-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .cx-name { font: 600 1.15rem/1.3 var(--font-body); margin: 0; }
  .cx-pill { font: 600 .75rem/1 var(--font-body); padding: .4rem .7rem; border-radius: 999px; background: var(--cream); color: var(--brick-dark); white-space: nowrap; }
  .cx-pill.s-New { background: #FCE6B6; color: #6A4A00; }
  .cx-pill.s-Not, .cx-pill.s-Test { background: #EEE; color: #555; }
  .cx-contact { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: .5rem 0 .2rem; }
  .cx-contact a { color: var(--brick); font-weight: 600; text-decoration: none; word-break: break-all; }
  .cx-contact a:hover { text-decoration: underline; }
  .cx-meta { margin: .4rem 0 0; color: var(--muted); font-size: .92rem; }
  .cx-msg { margin: .6rem 0 0; padding: .6rem .8rem; background: var(--paper); border-left: 3px solid var(--brass); border-radius: 6px; white-space: pre-wrap; font-size: .95rem; }
  .cx-msg small { display: block; color: var(--muted); font-size: .8rem; margin-bottom: .2rem; }
  .cx-edit { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr) auto; gap: 8px; margin-top: .9rem; align-items: start; }
  .cx-edit select, .cx-edit textarea { font: inherit; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); width: 100%; }
  .cx-edit textarea { min-height: 2.6rem; resize: vertical; }
  .cx-saved { font-size: .85rem; color: #2E7D4F; min-height: 1.1em; margin: .3rem 0 0; }
  .cx-saved.err { color: #A3262A; }
  .cx-msgbox { padding: 3rem 0; max-width: 34rem; }
  .cx-msgbox h1 { font-family: var(--font-display); color: var(--green-900); }
  .cx-empty { color: var(--muted); padding: 1rem 0 3rem; }
  .cx-remove { all: unset; cursor: pointer; font-size: .82rem; color: var(--muted); text-decoration: underline; margin-top: .4rem; }
  .cx-remove:hover { color: #A3262A; }
  .cx-group { list-style: none; font: 600 .78rem/1.2 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--brick); margin: 1rem 0 -.2rem; }
  .cx-group:first-child { margin-top: 0; }
  .cx-group span { color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 500; }
  .cx-login label { display: block; font-weight: 600; margin: 1rem 0 .4rem; }
  .cx-login-row { display: flex; gap: 8px; }
  .cx-login input { flex: 1; min-width: 0; font: inherit; padding: .65rem .9rem; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); }
  .cx-foot { color: var(--muted); font-size: .85rem; margin: 0 0 3rem; }
  .cx-foot button { all: unset; cursor: pointer; text-decoration: underline; }
  @media (max-width: 640px) {
    .cx-edit { grid-template-columns: 1fr; }
    .cx-edit .cx-btn { justify-self: start; }
  }
</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body class="no-brick look-soft">
<header class="cx-top">
  <div class="wrap">
    <a class="cx-brand" href="/">Magazine Mews<small>Contacts</small></a>
    <button class="cx-btn" type="button" id="cx-refresh">Refresh</button>
  </div>
</header>

<main class="wrap" id="main">
  <div class="cx-msgbox" id="cx-loading"><p>Loading the contacts…</p></div>

  <div class="cx-msgbox" id="cx-error" hidden>
    <h1>Contacts</h1>
    <p id="cx-error-text">Couldn't load the contacts just now. Please try again in a minute.</p>
  </div>

  <form class="cx-msgbox cx-login" id="cx-login" hidden>
    <h1>Contacts</h1>
    <label for="cx-pw">Password</label>
    <div class="cx-login-row">
      <input type="password" id="cx-pw" autocomplete="current-password" required>
      <button class="cx-btn primary" type="submit" id="cx-pw-go">Open</button>
    </div>
    <p class="cx-saved err" id="cx-pw-msg"></p>
  </form>

  <div id="cx-content" hidden>
    <div class="cx-head">
      <h1>Contacts</h1>
      <p class="cx-sum" id="cx-sum"></p>
    </div>
    <div class="cx-tools">
      <input type="search" id="cx-search" autocomplete="off" placeholder="Search names, emails, phone numbers, notes" aria-label="Search">
      <select id="cx-filter" aria-label="Show" autocomplete="off"><option value="">Everyone</option></select>
      <select id="cx-sort" aria-label="Sort" autocomplete="off">
        <option value="status">Sort: by status</option>
        <option value="newest">Sort: newest first</option>
        <option value="name">Sort: name A–Z</option>
      </select>
      <button class="cx-btn" type="button" id="cx-csv">Download spreadsheet</button>
    </div>
    <ul class="cx-list" id="cx-list"></ul>
    <p class="cx-empty" id="cx-empty" hidden>Nobody matches that.</p>
    <p class="cx-foot">Everyone who asks for the photos, opens them or sends an enquiry appears here, newest first.
      <button type="button" id="cx-forget">Sign out</button></p>
  </div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  // Old links carried a key; it isn't needed any more, so tidy it away.
  try { localStorage.removeItem("mm-admin-k"); } catch (e) {}
  if (location.search) history.replaceState(null, "", location.pathname);
  var api = "/api/admin";
  var contacts = [], statuses = [], loaded = false;
  // The password is kept only for this browser session.
  var PW = "mm-admin-pw", pw = "";
  try { pw = sessionStorage.getItem(PW) || ""; } catch (e) {}
  function headers(extra) { var h = { "X-Admin-Password": pw }; for (var n in (extra || {})) h[n] = extra[n]; return h; }
  function askPassword(msg) {
    $("cx-pw-msg").textContent = msg || "";
    show("cx-login"); $("cx-pw").value = ""; $("cx-pw").focus();
  }
  $("cx-login").addEventListener("submit", function (e) {
    e.preventDefault();
    pw = $("cx-pw").value.trim();
    try { sessionStorage.setItem(PW, pw); } catch (x) {}
    load();
  });

  function show(which) {
    ["cx-loading", "cx-error", "cx-content", "cx-login"].forEach(function (id) { $(id).hidden = id !== which; });
  }
  function fail(msg) { if (msg) $("cx-error-text").textContent = msg; show("cx-error"); }

  function when(s) {
    if (!s) return "";
    return new Date(s).toLocaleString("en-GB", { timeZone: "Europe/London", weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function telHref(p) { return "tel:" + String(p).replace(/[^\d+]/g, ""); }

  function card(c) {
    var li = el("li", "cx-card");
    var top = el("div", "cx-card-top");
    top.appendChild(el("p", "cx-name", c.name || c.email));
    var pill = el("span", "cx-pill s-" + c.status.split(/[ \/]/)[0], c.status);
    top.appendChild(pill);
    li.appendChild(top);

    var contact = el("div", "cx-contact");
    if (c.phone) { var t = el("a", null, c.phone); t.href = telHref(c.phone); contact.appendChild(t); }
    var m = el("a", null, c.email); m.href = "mailto:" + c.email; contact.appendChild(m);
    li.appendChild(contact);

    var bits = [];
    if (c.signedUp) bits.push("Asked for the photos " + when(c.signedUp));
    if (c.opens) bits.push("Opened them " + when(c.openedLast) + (c.opens > 1 ? " (" + c.opens + " times)" : ""));
    if (c.enquiries.length) bits.push(c.enquiries.length === 1 ? "Sent an enquiry" : "Sent " + c.enquiries.length + " enquiries");
    if (c.position) bits.push(c.position);
    if (c.heardVia) bits.push("Heard via " + c.heardVia);
    if (bits.length) li.appendChild(el("p", "cx-meta", bits.join(" · ")));

    c.enquiries.forEach(function (q) {
      var box = el("div", "cx-msg");
      box.appendChild(el("small", null, "Enquiry, " + when(q.at)));
      box.appendChild(document.createTextNode(q.message || "(no message)"));
      li.appendChild(box);
    });

    var edit = el("div", "cx-edit");
    var sel = el("select"); sel.setAttribute("aria-label", "Status");
    statuses.forEach(function (s) { var o = el("option", null, s); o.value = s; if (s === c.status) o.selected = true; sel.appendChild(o); });
    var notes = el("textarea"); notes.placeholder = "Notes"; notes.value = c.notes || ""; notes.setAttribute("aria-label", "Notes"); notes.rows = 1;
    var save = el("button", "cx-btn primary", "Save"); save.type = "button";
    edit.appendChild(sel); edit.appendChild(notes); edit.appendChild(save);
    li.appendChild(edit);
    var saved = el("p", "cx-saved");
    li.appendChild(saved);
    var rm = el("button", "cx-remove", "Remove this contact"); rm.type = "button";
    li.appendChild(rm);
    rm.addEventListener("click", function () {
      if (!confirm("Remove " + (c.name || c.email) + " from the list for good? This can't be undone.")) return;
      rm.disabled = true; saved.className = "cx-saved"; saved.textContent = "Removing…";
      fetch(api, { method: "POST", headers: headers({ "Content-Type": "application/json" }),
        body: JSON.stringify({ action: "remove", email: c.email }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error || ""); }); })
        .then(function () {
          contacts = contacts.filter(function (x) { return x !== c; });
          summary(); render();
        })
        .catch(function (e) { rm.disabled = false; saved.className = "cx-saved err"; saved.textContent = (e && e.message) || "That didn't remove. Please try again."; });
    });

    save.addEventListener("click", function () {
      save.disabled = true; saved.className = "cx-saved"; saved.textContent = "Saving…";
      fetch(api, { method: "POST", headers: headers({ "Content-Type": "application/json" }),
        body: JSON.stringify({ action: "status", email: c.email, status: sel.value, notes: notes.value }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error || ""); }); })
        .then(function () {
          c.status = sel.value; c.notes = notes.value;
          pill.textContent = c.status; pill.className = "cx-pill s-" + c.status.split(/[ \/]/)[0];
          saved.textContent = "Saved";
          summary();
        })
        .catch(function (e) { saved.className = "cx-saved err"; saved.textContent = (e && e.message) || "That didn't save. Please try again."; })
        .then(function () { save.disabled = false; });
    });
    return li;
  }

  function summary() {
    var asked = contacts.filter(function (c) { return c.signedUp; }).length;
    var opened = contacts.filter(function (c) { return c.opens; }).length;
    var enq = contacts.filter(function (c) { return c.enquiries.length; }).length;
    var fresh = contacts.filter(function (c) { return c.status === "New"; }).length;
    $("cx-sum").textContent = contacts.length + (contacts.length === 1 ? " person" : " people") +
      " · " + asked + " asked for the photos · " + opened + " opened them · " + enq + " sent an enquiry" +
      (fresh ? " · " + fresh + " still marked New" : "");
  }

  // Status groups in the order she works through them: people waiting to be
  // contacted first, finished ones last. Newest first inside each group.
  var ORDER = ["New", "Contacted", "Viewing booked", "Viewed", "Offer made", "Not interested", "Test / ignore"];
  var LABEL = { "New": "New – to contact" };
  function sorted(list, how) {
    var byNewest = function (a, b) { return a.lastSeen < b.lastSeen ? 1 : a.lastSeen > b.lastSeen ? -1 : 0; };
    var copy = list.slice();
    if (how === "name") return copy.sort(function (a, b) { return (a.name || a.email).localeCompare(b.name || b.email, "en-GB", { sensitivity: "base" }); });
    if (how === "newest") return copy.sort(byNewest);
    return copy.sort(function (a, b) {
      var d = ORDER.indexOf(a.status) - ORDER.indexOf(b.status);
      return d || byNewest(a, b);
    });
  }

  function render() {
    var term = $("cx-search").value.trim().toLowerCase();
    var only = $("cx-filter").value;
    var how = $("cx-sort").value;
    var list = $("cx-list"); list.textContent = "";
    var shown = 0, group = null;
    var match = sorted(contacts, how).filter(function (c) {
      if (only && c.status !== only) return false;
      if (term) {
        var hay = [c.name, c.email, c.phone, c.notes, c.position, c.enquiries.map(function (q) { return q.message; }).join(" ")].join(" ").toLowerCase();
        if (hay.indexOf(term) === -1 && hay.replace(/\s/g, "").indexOf(term.replace(/\s/g, "")) === -1) return false;
      }
      return true;
    });
    match.forEach(function (c) {
      if (how === "status" && c.status !== group) {
        group = c.status;
        var n = match.filter(function (x) { return x.status === group; }).length;
        var h = el("li", "cx-group", LABEL[group] || group);
        h.appendChild(el("span", null, " · " + n));
        list.appendChild(h);
      }
      list.appendChild(card(c)); shown += 1;
    });
    $("cx-empty").hidden = shown > 0;
    if (!contacts.length) $("cx-empty").textContent = "No contacts yet. They'll appear here as people use the forms.";
  }

  function load() {
    if (!pw) return askPassword();
    show("cx-loading");
    fetch(api, { cache: "no-store", headers: headers() })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.ok) { var e = new Error(j.error || ""); e.status = r.status; throw e; } return j; }); })
      .then(function (j) {
        contacts = j.contacts || []; statuses = j.statuses || [];
        // Always open on Everyone; a Refresh keeps whatever is picked.
        var f = $("cx-filter"), keep = loaded ? f.value : "";
        f.textContent = ""; f.appendChild(el("option", null, "Everyone")).value = "";
        statuses.forEach(function (s) { var o = el("option", null, s); o.value = s; f.appendChild(o); });
        f.value = keep;
        if (!loaded) $("cx-search").value = "";
        loaded = true;
        summary(); render(); show("cx-content");
      })
      .catch(function (e) {
        if (e && e.status === 401) { pw = ""; try { sessionStorage.removeItem(PW); } catch (x) {} return askPassword("That password isn't right."); }
        fail((e && e.message) || "Couldn't load the contacts just now. Please try again in a minute.");
      });
  }

  $("cx-search").addEventListener("input", render);
  $("cx-filter").addEventListener("change", render);
  $("cx-sort").addEventListener("change", render);
  $("cx-refresh").addEventListener("click", load);
  $("cx-forget").addEventListener("click", function () {
    try { sessionStorage.removeItem(PW); } catch (e) {}
    location.replace("/");
  });
  $("cx-csv").addEventListener("click", function () {
    var b = $("cx-csv"); b.disabled = true;
    fetch(api + "?format=csv", { cache: "no-store", headers: headers() })
      .then(function (r) { if (!r.ok) throw new Error(); return r.blob(); })
      .then(function (blob) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = "magazine-mews-contacts.csv";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      })
      .catch(function () { alert("Couldn't make the spreadsheet just now. Please try again."); })
      .then(function () { b.disabled = false; });
  });

  load();
})();
</script>
</body>
</html>
