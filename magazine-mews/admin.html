<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Contacts · Magazine Mews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* Mom's contacts page, 2 Nov 2026. Same theme as the main page. */
  :root {
    --green-900: #4A1F3D; --green-950: #2E1428; --green-800: #4A1F3D; --green-700: #6B2350;
    --brass: #A83D6C; --brass-light: #F1DCE6; --brick: #8E2F5A; --brick-dark: #5E1F48;
    --paper: #FBF4F6; --cream: #F3DEE7; --ink: #2E1428; --muted: #5A3A50;
    --green-100: #F3DEE7; --mortar: #EBD5DE; --line: #EBD5DE;
    --font-display: "Fraunces", Georgia, serif; --font-body: "DM Sans", system-ui, sans-serif;
  }
  body { background: var(--paper); color: var(--ink); }
  .ad-top { border-bottom: 1px solid var(--line); background: #fff; }
  .ad-top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; }
  .ad-brand { font: 600 1.2rem/1.1 var(--font-display); color: var(--green-900); text-decoration: none; }
  .ad-brand small { display: block; font: 600 .66rem/1.4 var(--font-body); letter-spacing: .18em; text-transform: uppercase; color: var(--brick); }
  .ad-head { padding: 2rem 0 1rem; }
  .ad-head h1 { font-family: var(--font-display); color: var(--green-900); font-size: clamp(1.9rem, 5vw, 2.6rem); margin: 0 0 .4rem; }
  .ad-sum { margin: 0; color: var(--muted); }
  .ad-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 1rem 0 1.4rem; }
  .ad-tools input, .ad-tools select { font: inherit; padding: .65rem .9rem; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); }
  .ad-tools input { flex: 1 1 220px; min-width: 0; }
  .ad-btn { font: 600 .95rem var(--font-body); padding: .65rem 1.1rem; border-radius: 999px; border: 1px solid var(--brass); background: #fff; color: var(--brick); cursor: pointer; }
  .ad-btn.primary { background: var(--brass); color: #fff; }
  .ad-btn:disabled { opacity: .6; cursor: default; }
  .ad-list { list-style: none; margin: 0 0 3rem; padding: 0; display: grid; gap: 14px; }
  .ad-card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 1.1rem 1.2rem; }
  .ad-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .ad-name { font: 600 1.15rem/1.3 var(--font-body); margin: 0; }
  .ad-pill { font: 600 .75rem/1 var(--font-body); padding: .4rem .7rem; border-radius: 999px; background: var(--cream); color: var(--brick-dark); white-space: nowrap; }
  .ad-pill.s-New { background: #FCE6B6; color: #6A4A00; }
  .ad-pill.s-Not, .ad-pill.s-Test { background: #EEE; color: #555; }
  .ad-contact { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: .5rem 0 .2rem; }
  .ad-contact a { color: var(--brick); font-weight: 600; text-decoration: none; word-break: break-all; }
  .ad-contact a:hover { text-decoration: underline; }
  .ad-meta { margin: .4rem 0 0; color: var(--muted); font-size: .92rem; }
  .ad-msg { margin: .6rem 0 0; padding: .6rem .8rem; background: var(--paper); border-left: 3px solid var(--brass); border-radius: 6px; white-space: pre-wrap; font-size: .95rem; }
  .ad-msg small { display: block; color: var(--muted); font-size: .8rem; margin-bottom: .2rem; }
  .ad-edit { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr) auto; gap: 8px; margin-top: .9rem; align-items: start; }
  .ad-edit select, .ad-edit textarea { font: inherit; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); width: 100%; }
  .ad-edit textarea { min-height: 2.6rem; resize: vertical; }
  .ad-saved { font-size: .85rem; color: #2E7D4F; min-height: 1.1em; margin: .3rem 0 0; }
  .ad-saved.err { color: #A3262A; }
  .ad-msgbox { padding: 3rem 0; max-width: 34rem; }
  .ad-msgbox h1 { font-family: var(--font-display); color: var(--green-900); }
  .ad-empty { color: var(--muted); padding: 1rem 0 3rem; }
  .ad-foot { color: var(--muted); font-size: .85rem; margin: 0 0 3rem; }
  .ad-foot button { all: unset; cursor: pointer; text-decoration: underline; }
  @media (max-width: 640px) {
    .ad-edit { grid-template-columns: 1fr; }
    .ad-edit .ad-btn { justify-self: start; }
  }
</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body class="no-brick look-soft">
<header class="ad-top">
  <div class="wrap">
    <a class="ad-brand" href="/">Magazine Mews<small>Contacts</small></a>
    <button class="ad-btn" type="button" id="ad-refresh">Refresh</button>
  </div>
</header>

<main class="wrap" id="main">
  <div class="ad-msgbox" id="ad-loading"><p>Loading the contacts…</p></div>

  <div class="ad-msgbox" id="ad-error" hidden>
    <h1>This page needs your link</h1>
    <p id="ad-error-text">Open the contacts link Mark sent you. After that, this device remembers it.</p>
  </div>

  <div id="ad-content" hidden>
    <div class="ad-head">
      <h1>Contacts</h1>
      <p class="ad-sum" id="ad-sum"></p>
    </div>
    <div class="ad-tools">
      <input type="search" id="ad-search" placeholder="Search names, emails, phone numbers, notes" aria-label="Search">
      <select id="ad-filter" aria-label="Show"><option value="">Everyone</option></select>
      <button class="ad-btn" type="button" id="ad-csv">Download spreadsheet</button>
    </div>
    <ul class="ad-list" id="ad-list"></ul>
    <p class="ad-empty" id="ad-empty" hidden>Nobody matches that.</p>
    <p class="ad-foot">Everyone who asks for the photos, opens them or sends an enquiry appears here, newest first.
      <button type="button" id="ad-forget">Forget this device</button></p>
  </div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var STORE = "mm-admin-k";
  var q = new URLSearchParams(location.search);
  var k = q.get("k") || "";
  // Remember the key on this device and take it out of the address bar.
  if (k) {
    try { localStorage.setItem(STORE, k); } catch (e) {}
    history.replaceState(null, "", location.pathname);
  } else {
    try { k = localStorage.getItem(STORE) || ""; } catch (e) {}
  }
  var api = "/api/admin?k=" + encodeURIComponent(k);
  var contacts = [], statuses = [];

  function show(which) {
    ["ad-loading", "ad-error", "ad-content"].forEach(function (id) { $(id).hidden = id !== which; });
  }
  function fail(msg) { if (msg) $("ad-error-text").textContent = msg; show("ad-error"); }
  if (!k) return fail();

  function when(s) {
    if (!s) return "";
    return new Date(s).toLocaleString("en-GB", { timeZone: "Europe/London", weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function telHref(p) { return "tel:" + String(p).replace(/[^\d+]/g, ""); }

  function card(c) {
    var li = el("li", "ad-card");
    var top = el("div", "ad-card-top");
    top.appendChild(el("p", "ad-name", c.name || c.email));
    var pill = el("span", "ad-pill s-" + c.status.split(/[ \/]/)[0], c.status);
    top.appendChild(pill);
    li.appendChild(top);

    var contact = el("div", "ad-contact");
    if (c.phone) { var t = el("a", null, c.phone); t.href = telHref(c.phone); contact.appendChild(t); }
    var m = el("a", null, c.email); m.href = "mailto:" + c.email; contact.appendChild(m);
    li.appendChild(contact);

    var bits = [];
    if (c.signedUp) bits.push("Asked for the photos " + when(c.signedUp));
    if (c.opens) bits.push("Opened them " + when(c.openedLast) + (c.opens > 1 ? " (" + c.opens + " times)" : ""));
    if (c.enquiries.length) bits.push(c.enquiries.length === 1 ? "Sent an enquiry" : "Sent " + c.enquiries.length + " enquiries");
    if (c.position) bits.push(c.position);
    if (c.heardVia) bits.push("Heard via " + c.heardVia);
    if (bits.length) li.appendChild(el("p", "ad-meta", bits.join(" · ")));

    c.enquiries.forEach(function (q) {
      var box = el("div", "ad-msg");
      box.appendChild(el("small", null, "Enquiry, " + when(q.at)));
      box.appendChild(document.createTextNode(q.message || "(no message)"));
      li.appendChild(box);
    });

    var edit = el("div", "ad-edit");
    var sel = el("select"); sel.setAttribute("aria-label", "Status");
    statuses.forEach(function (s) { var o = el("option", null, s); o.value = s; if (s === c.status) o.selected = true; sel.appendChild(o); });
    var notes = el("textarea"); notes.placeholder = "Notes"; notes.value = c.notes || ""; notes.setAttribute("aria-label", "Notes"); notes.rows = 1;
    var save = el("button", "ad-btn primary", "Save"); save.type = "button";
    edit.appendChild(sel); edit.appendChild(notes); edit.appendChild(save);
    li.appendChild(edit);
    var saved = el("p", "ad-saved");
    li.appendChild(saved);

    save.addEventListener("click", function () {
      save.disabled = true; saved.className = "ad-saved"; saved.textContent = "Saving…";
      fetch(api, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "status", email: c.email, status: sel.value, notes: notes.value }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error || ""); }); })
        .then(function () {
          c.status = sel.value; c.notes = notes.value;
          pill.textContent = c.status; pill.className = "ad-pill s-" + c.status.split(/[ \/]/)[0];
          saved.textContent = "Saved";
          summary();
        })
        .catch(function (e) { saved.className = "ad-saved err"; saved.textContent = (e && e.message) || "That didn't save. Please try again."; })
        .then(function () { save.disabled = false; });
    });
    return li;
  }

  function summary() {
    var asked = contacts.filter(function (c) { return c.signedUp; }).length;
    var opened = contacts.filter(function (c) { return c.opens; }).length;
    var enq = contacts.filter(function (c) { return c.enquiries.length; }).length;
    var fresh = contacts.filter(function (c) { return c.status === "New"; }).length;
    $("ad-sum").textContent = contacts.length + (contacts.length === 1 ? " person" : " people") +
      " · " + asked + " asked for the photos · " + opened + " opened them · " + enq + " sent an enquiry" +
      (fresh ? " · " + fresh + " still marked New" : "");
  }

  function render() {
    var term = $("ad-search").value.trim().toLowerCase();
    var only = $("ad-filter").value;
    var list = $("ad-list"); list.textContent = "";
    var shown = 0;
    contacts.forEach(function (c) {
      if (only && c.status !== only) return;
      if (term) {
        var hay = [c.name, c.email, c.phone, c.notes, c.position, c.enquiries.map(function (q) { return q.message; }).join(" ")].join(" ").toLowerCase();
        if (hay.indexOf(term) === -1 && hay.replace(/\s/g, "").indexOf(term.replace(/\s/g, "")) === -1) return;
      }
      list.appendChild(card(c)); shown += 1;
    });
    $("ad-empty").hidden = shown > 0;
    if (!contacts.length) $("ad-empty").textContent = "No contacts yet. They'll appear here as people use the forms.";
  }

  function load() {
    show("ad-loading");
    fetch(api, { cache: "no-store" })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.ok) { var e = new Error(j.error || ""); e.status = r.status; throw e; } return j; }); })
      .then(function (j) {
        contacts = j.contacts || []; statuses = j.statuses || [];
        var f = $("ad-filter"), keep = f.value;
        f.textContent = ""; f.appendChild(el("option", null, "Everyone")).value = "";
        statuses.forEach(function (s) { var o = el("option", null, s); o.value = s; f.appendChild(o); });
        f.value = keep;
        summary(); render(); show("ad-content");
      })
      .catch(function (e) {
        if (e && e.status === 403) { try { localStorage.removeItem(STORE); } catch (x) {} return fail("This link isn't right. Please open the contacts link Mark sent you."); }
        fail((e && e.message) || "Couldn't load the contacts just now. Please try again in a minute.");
      });
  }

  $("ad-search").addEventListener("input", render);
  $("ad-filter").addEventListener("change", render);
  $("ad-refresh").addEventListener("click", load);
  $("ad-forget").addEventListener("click", function () {
    try { localStorage.removeItem(STORE); } catch (e) {}
    location.replace("/");
  });
  $("ad-csv").addEventListener("click", function () {
    var b = $("ad-csv"); b.disabled = true;
    fetch(api + "&format=csv", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(); return r.blob(); })
      .then(function (blob) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = "magazine-mews-contacts.csv";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      })
      .catch(function () { alert("Couldn't make the spreadsheet just now. Please try again."); })
      .then(function () { b.disabled = false; });
  });

  load();
})();
</script>
</body>
</html>
